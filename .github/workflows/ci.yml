name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Both check scripts are deliberately dependency-free: they read the
      # committed JSON outputs and the published HTML, so CI needs no install
      # step and no access to the 102 MB raw event feed, which is not committed.

      - name: Pipeline invariants
        run: python pipeline/australia/checks.py

      - name: Publication checks
        run: python site_checks.py
