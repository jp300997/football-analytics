  const c = df.conceded || {};
  h += `<div class=card><h3>What they concede</h3><table>` +
    [['Shots / in box', `${f(c.shots, 1)} / ${f(c.shots_in_box, 1)}`], ['Big chances', f(c.big_chances)], ['Crosses faced', f(c.crosses, 0)], ['Deep completions allowed', f(c.deep_allowed, 1)], ['Set-piece share of xGA', pct(c.sp_xga_share)], ['Counter share of xGA', pct(c.fast_xga_share)], ['xGA after 75\'', pct(c.late_xga_share)], ['xGA per 90 when leading', f(c.xga90_leading)]]
    .map(([k, v]) => `<tr><th>${k}</th><td>${v}</td></tr>`).join('') + '</table>' +
    (c.entries_by_channel_conceded ? `<div>Entries conceded: their left ${pct(c.entries_by_channel_conceded.their_left)} / centre ${pct(c.entries_by_channel_conceded.centre)} / their right ${pct(c.entries_by_channel_conceded.their_right)}` + bar([c.entries_by_channel_conceded.their_left, c.entries_by_channel_conceded.centre, c.entries_by_channel_conceded.their_right], ['var(--rust)', 'var(--amber)', 'var(--green)']) + '</div>' : '') + '</div></div>';
  // game states
  h += `<h2>Game states</h2><div class=card>`;
  const bs = g.by_state || {};
  if (Object.keys(bs).length) {
    h += `<div class=wrap><table><tr><th>State</th><th>Minutes</th><th>Tilt</th><th>PPDA</th><th>Shots/90</th><th>Box/90</th><th>Counters/90</th><th>Set pieces/90</th><th>Crosses/90</th><th>Long share</th><th>Conceded shots/90</th><th>Conceded counters/90</th></tr>` +
      ['level', 'leading', 'trailing'].filter(k => bs[k]).map(k => { const x = bs[k]; return `<tr><td><b>${k}</b></td><td>${f(x.minutes, 0)}</td><td>${pct(x.tilt)}</td><td>${f(x.ppda, 1)}</td><td>${f(x.shots_90, 1)}</td><td>${f(x.box_shots_90, 1)}</td><td>${f(x.fast_break_shots_90)}</td><td>${f(x.set_piece_shots_90)}</td><td>${f(x.crosses_90, 1)}</td><td>${pct(x.long_share)}</td><td>${f(x.conceded_shots_90, 1)}</td><td>${f(x.conceded_fast_break_90)}</td></tr>`; }).join('') + '</table></div>';
  }
  if (g.understat_by_state && Object.keys(g.understat_by_state).length) h += `<div><span class=muted>Understat xG / xGA per 90 by score:</span> ` + Object.entries(g.understat_by_state).map(([k, v]) => `<span class=chip>${esc(k)}: ${f(v.xg90)} / ${f(v.xga90)}</span>`).join('') + '</div>';
  if (g.scoring_rate_multipliers) h += `<div><span class=muted>Scoring-rate multiplier by goal difference (-2..+2, level = 1):</span> ${chips(g.scoring_rate_multipliers)} <span class=muted>conceding:</span> ${chips(g.conceding_rate_multipliers)}</div>`;
  const fc = g.formation_changes;
  if (fc) h += `<div style="margin-top:6px"><b>Formation changes:</b> ${f(fc.per_match)} per match, by state ${chips(fc.by_state)}; targets ${(fc.targets || []).map(x => esc(x.shape) + ' (' + x.n + ')').join(', ')}; typical minute ${f(fc.median_minute, 0)}` +
    (fc.targets_by_state ? '<div class=muted>' + Object.entries(fc.targets_by_state).map(([k, v]) => `${k}: ` + (v.length ? v.map(x => esc(x.shape) + ' ' + x.n).join(', ') : '-')).join(' &middot; ') + '</div>' : '') + '</div>';
  const sb = g.substitutions;
  if (sb) h += `<div><b>Substitutions:</b> ${f(sb.subs_per_match, 1)} per match, first at ${f(sb.first_sub_median_minute, 0)}' (median), ${f(sb.first_sub_before_60_pct, 0)}% before 60'; share by state ${chips(sb.subs_by_state)}; most used: ${(sb.most_used_subs || []).map(x => esc(x.player) + ' (' + x.n + ')').join(', ')}</div>`;
  const fg = g.first_goal;
  if (fg) h += `<div><b>First goal:</b> score first in ${f(fg.scored_first_pct, 0)}% of matches; win ${f(fg.win_pct_when_scoring_first, 0)}% when they do; ${f(fg.points_per_game_when_conceding_first)} points per game after conceding first (${f(fg.comeback_points_pct, 0)}% of those matches not lost)</div>`;
  h += '</div>';
  // scoring & players
  h += `<h2>Scoring, timing & personnel</h2><div class=grid><div class=card><h3>When they score / concede</h3>`;
  if (sc.timing_xg_share) h += `<div class=muted>xG share by 15-minute bin</div>` + Object.entries(sc.timing_xg_share).map(([k, v]) => `<div style="display:flex;gap:8px;align-items:center"><span style="width:44px" class=muted>${k}</span><div class=bar style="flex:1"><span style="width:${v * 3}%;background:var(--green)"></span></div><span style="width:36px">${f(v, 0)}%</span><div class=bar style="flex:1"><span style="width:${(sc.timing_xga_share?.[k] || 0) * 3}%;background:var(--rust)"></span></div><span style="width:36px">${f(sc.timing_xga_share?.[k], 0)}%</span></div>`).join('') + '<div class=muted>green = for, rust = against</div>';
  if (sc.shots_xg) h += `<div style="margin-top:6px">Finishing: ${sc.shots_xg.goals} goals from ${f(sc.shots_xg.xg, 1)} xG (${sc.shots_xg.goals_minus_xg > 0 ? '+' : ''}${f(sc.shots_xg.goals_minus_xg, 1)}); big-chance conversion ${f(sc.shots_xg.big_chance_conversion_pct, 0)}%</div>`;
  h += '</div>';
  h += `<div class=card><h3>Scorers & creators (Understat, last two seasons)</h3><div class=wrap><table><tr><th>Player</th><th>Pos</th><th>Min</th><th>Goals</th><th>npxG/90</th><th>xA/90</th><th>Share of output</th></tr>` + (sc.scorers || []).map(x => `<tr><td>${esc(x.player)}</td><td>${esc(x.pos)}</td><td>${x.minutes}</td><td>${x.goals}</td><td>${f(x.npxg90)}</td><td>${f(x.xa90)}</td><td>${pct(x.share_of_output)}</td></tr>`).join('') + '</table></div>' +
    (sc.creators && sc.creators.length ? `<div class=muted style="margin-top:6px">Creators: ` + sc.creators.map(x => `${esc(x.player)} (${f(x.xa90)} xA/90, ${f(x.key_passes90, 1)} KP/90)`).join(', ') + '</div>' : '') + '</div>';
  h += `<div class=card><h3>Key players by event involvement</h3><div class=wrap><table><tr><th>Player</th><th>Role</th><th>Channel</th><th>FT touches</th><th>Key passes</th><th>Box passes</th><th>Shots</th><th>Def actions</th><th>High wins</th><th>Status</th></tr>` +
    (d.key_players || []).map(x => `<tr><td>${esc(x.player)}</td><td>${esc(x.role)}</td><td>${esc(x.channel)}</td><td>${f(x.ft_touches_pm, 1)}</td><td>${f(x.key_passes_pm)}</td><td>${f(x.box_passes_pm)}</td><td>${f(x.shots_pm)}</td><td>${f(x.def_actions_pm, 1)}</td><td>${f(x.high_wins_pm)}</td><td class="status-${esc(x.status)}">${esc(x.status)}</td></tr>`).join('') + '</table></div>' +
    (d.injuries && d.injuries.length ? `<div style="margin-top:6px"><span class=muted>Injuries / suspensions:</span> ` + d.injuries.map(x => `<span class=chip>${esc(x.player)} <span class=muted>${esc(x.reason)}${x.expected_return ? ', back ' + esc(x.expected_return) : ''}</span></span>`).join('') + '</div>' : '') + '</div></div>';
  // set pieces
  h += `<h2>Set pieces</h2><div class=card><table>` +
    [['Corners for / against per match', `${f(sp.corners_for_per_match)} / ${f(sp.corners_against_per_match)}`], ['Shots per corner (for / conceded)', `${pct(sp.shots_per_corner)} / ${pct(sp.shots_conceded_per_corner)}`], ['Goals from corners (for / against)', `${sp.goals_from_corners ?? '-'} / ${sp.goals_conceded_from_corners ?? '-'}`],
     ['Left-side share of their corners', pct(sp.left_side_share)], ['Short-corner share', pct(sp.short_corner_share)], ['Set-piece share of xG / xGA', `${pct(sp.sp_xg_share)} / ${pct(sp.sp_xga_share)}`], ['Penalty xG for / against per season', `${f(sp.pen_xg, 1)} / ${f(sp.pen_xga, 1)}`]]
    .map(([k, v]) => `<tr><th>${k}</th><td>${v}</td></tr>`).join('') + '</table>' +
    (sp.corner_takers ? `<div><span class=muted>Takers:</span> ` + sp.corner_takers.map(x => `<span class=chip>${esc(x.player)} ${f(x.share_pct, 0)}%</span>`).join('') + (sp.corner_target_zone_pct ? ` <span class=muted>target zone</span> ${chips(sp.corner_target_zone_pct)}` : '') + '</div>' : '') +
    (sp.corner_defenders ? `<div><span class=muted>Their corner defenders (first contacts):</span> ` + sp.corner_defenders.map(x => `<span class=chip>${esc(x.player)} ${x.n}</span>`).join('') + '</div>' : '') +
    (sp.free_kicks ? `<div class=muted>Free kicks: ${esc(JSON.stringify(sp.free_kicks).slice(0, 300))}</div>` : '') + '</div>';
  document.getElementById('out').innerHTML = h;
  try { localStorage.setItem('dossier_team', t); } catch (e) {}
}
sel.onchange = () => render(sel.value);
let start = teams.find(t => (D.teams[t].sources || []).length >= 5) || teams[0]; try { const s = localStorage.getItem('dossier_team'); if (s && D.teams[s]) start = s; } catch (e) {}
sel.value = start; render(start);
</script>
