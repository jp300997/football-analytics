const pitchFrame = (L, T, PW, PH, topLabel, bottomLabel) => `<rect x="${L}" y="${T}" width="${PW}" height="${PH}" rx="6" fill="var(--pitch)" stroke="var(--pitchline)" /><line x1="${L}" y1="${T + PH / 2}" x2="${L + PW}" y2="${T + PH / 2}" stroke="var(--pitchline)" /><circle cx="${L + PW / 2}" cy="${T + PH / 2}" r="${PW * 0.11}" fill="none" stroke="var(--pitchline)" /><rect x="${L + PW * 0.21}" y="${T}" width="${PW * 0.58}" height="${PH * 0.155}" fill="none" stroke="var(--pitchline)" /><rect x="${L + PW * 0.21}" y="${T + PH * 0.845}" width="${PW * 0.58}" height="${PH * 0.155}" fill="none" stroke="var(--pitchline)" /><text x="${L + PW / 2}" y="${T - 5}" font-size="10.5" text-anchor="middle" fill="var(--muted)">${esc(topLabel || '')}</text><text x="${L + PW / 2}" y="${T + PH + 13}" font-size="10.5" text-anchor="middle" fill="var(--muted)">${esc(bottomLabel || '')}</text>`;
const legend = items => `<div class="legend small">${items.map(([sw, txt]) => `<span>${sw}${esc(txt)}</span>`).join('')}</div>`;
const colourKey = (good, bad) => `<div class=colourkey><span><i style="background:var(--opp)"></i>blue = ${esc(good)}</span><span><i style="background:var(--thr)"></i>orange = ${esc(bad)}</span><span><i style="background:var(--muted)"></i>grey = context</span></div>`;
</script>
<script>
const FX = DATA.fixtures || [], QS = new URLSearchParams(location.search), PRINT = QS.get('print') === '1';
let cur = 0, view = 'home', slide = 0;
try { const s = localStorage.getItem('prematch_fx'); const i = FX.findIndex(x => x.id === s); if (i >= 0) cur = i; const v = localStorage.getItem('prematch_view'); if (v === 'away' || v === 'home') view = v; } catch (e) {}
if (QS.get('fixture')) { const i = FX.findIndex(x => x.id === QS.get('fixture')); if (i >= 0) { cur = i; view = QS.get('side') === 'away' ? 'away' : 'home'; } }
const TITLES = ['How we win', 'Where the space is', 'Your duel', 'Set pieces', 'Watch these clips'];
const msg = (tone, head, text, extra) => `<div class="msg t-${tone || 'neutral'}"><b>${esc(head)}</b>${esc(text)}${extra || ''}</div>`;

// slide 2: we attack UP the page.  lane 0 = the attacking side's right wing .. 4 = its left wing; band 0 = own goal line .. 5 = the opponent's box
function spacePitch(S, us, them) { const W = 420, H = 560, L = 20, T = 30, PW = 380, PH = 500; let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(S.title)}">` + pitchFrame(L, T, PW, PH, them + ' goal (we attack up the page)', us + ' goal');
  const zone = (z, mineUp, col) => { if (!z) return ''; const x0 = mineUp ? L + PW * (1 - (z.lane + 1) / 5) : L + PW * (z.lane / 5), y0 = mineUp ? T + PH * (1 - (z.band + 1) / 6) : T + PH * (z.band / 6), w = PW / 5, h = PH / 6, cx = x0 + w / 2;
    const ay0 = mineUp ? y0 + h + 70 : y0 - 70, ay1 = mineUp ? y0 + h + 8 : y0 - 8;
    return `<rect x="${x0.toFixed(1)}" y="${y0.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="5" fill="${col}" opacity="0.8" /><line x1="${cx.toFixed(1)}" y1="${ay0.toFixed(1)}" x2="${cx.toFixed(1)}" y2="${ay1.toFixed(1)}" stroke="${col}" stroke-width="7" stroke-linecap="round" /><path d="M${(cx - 13).toFixed(1)} ${(ay1 + (mineUp ? 16 : -16)).toFixed(1)}L${cx.toFixed(1)} ${ay1.toFixed(1)}L${(cx + 13).toFixed(1)} ${(ay1 + (mineUp ? 16 : -16)).toFixed(1)}" fill="none" stroke="${col}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />` +
      `<text x="${Math.max(L + 62, Math.min(L + PW - 62, cx)).toFixed(1)}" y="${(mineUp ? ay0 + 24 : ay0 - 12).toFixed(1)}" font-size="17" font-weight="600" text-anchor="middle" fill="${col}">${esc(z.label)}</text>`; };
  return s + zone(S.orange, false, 'var(--thr)') + zone(S.blue, true, 'var(--opp)') + '</svg>'; }
// slide 4: a penalty box seen from the pitch, corner taken from the left of the picture.  zone = six | near | far | spot | edge
function boxPic(zone, col, label) { const W = 400, H = 210; const Z = {six: [150, 10, 100, 42], near: [104, 10, 70, 60], far: [226, 10, 70, 60], spot: [150, 62, 100, 50], edge: [120, 132, 160, 40]}[zone]; if (!Z) return '';
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}"><rect x="2" y="10" width="${W - 4}" height="${H - 12}" fill="var(--pitch)" stroke="var(--pitchline)" /><rect x="60" y="10" width="280" height="130" fill="none" stroke="var(--pitchline)" stroke-width="2" /><rect x="140" y="10" width="120" height="44" fill="none" stroke="var(--pitchline)" stroke-width="2" /><rect x="170" y="2" width="60" height="8" fill="none" stroke="var(--ink)" stroke-width="2" /><circle cx="200" cy="98" r="2.5" fill="var(--pitchline)" />` +
    `<rect x="${Z[0]}" y="${Z[1]}" width="${Z[2]}" height="${Z[3]}" rx="5" fill="${col}" opacity="0.8" /><path d="M6 14 Q ${Z[0] * 0.5} ${Z[1] + Z[3] + 60} ${Z[0] + Z[2] / 2} ${Z[1] + Z[3] / 2}" fill="none" stroke="${col}" stroke-width="3.5" stroke-dasharray="7 6" /><circle cx="6" cy="14" r="5" fill="${col}" /><text x="${W / 2}" y="${H - 12}" font-size="15" font-weight="600" text-anchor="middle" fill="${col}">${esc(label)}</text></svg>`; }

function slides(F, side) { const S = F.sides[side], us = F[side], them = F[side === 'home' ? 'away' : 'home'];
  const top = i => `<div class=sk><span>${esc(F.home)} v ${esc(F.away)}, ${esc(F.day)}. Pack for ${esc(us)}</span><span>${i + 1} / 5</span></div><h2>${esc(TITLES[i])}</h2>`;
  const key = `<div class=foot><span style="color:var(--opp);font-weight:600">Blue</span> = our opening. <span style="color:var(--thr);font-weight:600">Orange</span> = their threat.</div>`;
  const out = [];
  out.push(top(0) + ((S.win || []).length ? S.win.map(m => msg(m.tone, m.head, m.text)).join('') : msg('neutral', 'Prepare from video', 'No evidence-backed plan line for ' + them + ': they were not in last season\'s data.')) + key);
  out.push(top(1) + `<div class=pitchcol><div>${spacePitch(S.space, us, them)}</div><div style="display:flex;flex-direction:column;gap:1.6cqw">${msg(S.space.blue ? 'good' : 'neutral', S.space.title, '')}${(S.space.lines || []).map(l => `<div class="msg t-${l.tone}" style="font-size:2.2cqw">${esc(l.text)}</div>`).join('')}</div></div>` + key);
  const men = S.men || [];
  out.push(top(2) + (men.length
    ? `<div class=eleven>${men.map(m => `<div class="pc t-${m.tone || 'neutral'}"><b>${esc(m.us)}${m.them ? ' <span class=vs>v</span> ' + esc(m.them) : ''}</b><div class=pdo>${esc(m.do)}</div></div>`).join('')}</div>`
      + ((S.cues || []).length ? `<div class=cues>${S.cues.map(c => `<div><b>${esc(c.lab)}</b> ${esc(c.cue)}</div>`).join('')}</div>` : '')
      + (S.nodata ? `<div class=small2>${esc(S.nodata)}</div>` : '')
    : msg('neutral', 'No duel picked out', S.no_duel || 'Prepare the match-ups from video.')) + key);
  const sp = S.sp || {ours: {}, theirs: {}}, spCol = (x, tone, col, lab) => `<div>${msg(tone, x.head || lab, x.text || '')}${x.zone ? boxPic(x.zone, col, lab) : ''}</div>`;
  out.push(top(3) + `<div class=cols>${spCol(sp.ours || {}, 'good', 'var(--opp)', 'we aim here')}${spCol(sp.theirs || {}, 'bad', 'var(--thr)', 'they aim here')}</div>${(sp.notes || []).map(n => `<div class=small2>${esc(n)}</div>`).join('')}` + key);
  const cl = S.clips || [];
  out.push(top(4) + (cl.length ? `<div class=cols style="grid-template-columns:1fr 1fr;gap:1.6cqw 3cqw">${cl.map(g => `<div class="msg t-${g.tone}" style="padding-top:0;padding-bottom:0"><div class=ch style="color:${toneCol(g.tone)}">${esc(g.head)}</div><div class=clip>${g.rows.map(r => `<span>${esc(r.min)}'</span><span>${esc(r.match)}${r.what ? '. ' + esc(r.what) : ''}</span>`).join('')}</div></div>`).join('')}</div>` : msg('neutral', 'No clip list', them + ' were not in last season\'s event data. Build the clips from video.')) +
    `<div class=foot>All from ${esc(them)}'s 2025/26 matches. A list for the video analyst: match and minute only, no footage is stored here. ${key.replace(/<\/?div[^>]*>/g, '')}</div>`);
  return out.map((h, i) => `<section class="slide${i === slide || PRINT ? ' on' : ''}" data-i="${i}">${h}</section>`).join(''); }

function show(i) { slide = Math.max(0, Math.min(4, i)); document.querySelectorAll('.slide').forEach(s => s.classList.toggle('on', Number(s.dataset.i) === slide)); document.querySelectorAll('.deckbar [data-go]').forEach(b => b.classList.toggle('on', Number(b.dataset.go) === slide)); }
function render() { const F = FX[cur]; if (!F) { document.getElementById('out').innerHTML = '<div class=card>No upcoming fixture with a dossier for both clubs.</div>'; return; }
  if (PRINT) { document.body.classList.add('printmode'); document.getElementById('out').innerHTML = `<div class=deck>${slides(F, view)}</div>`; return; }
  const us = F[view], groups = {}; FX.forEach((x, i) => { const k = x.comp + ' : ' + x.day; (groups[k] = groups[k] || []).push(i); });
  let h = `<div class=ctrl><label for=fx><b>Fixture</b></label><select id=fx>${Object.entries(groups).map(([g, ids]) => `<optgroup label="${esc(g)}">${ids.map(i => `<option value="${i}"${i === cur ? ' selected' : ''}>${esc(FX[i].home)} v ${esc(FX[i].away)}</option>`).join('')}</optgroup>`).join('')}</select>
    <span><b>Pack for</b> <span class=seg><button data-view="home" class="${view === 'home' ? 'on' : ''}">${esc(F.home)}</button><button data-view="away" class="${view === 'away' ? 'on' : ''}">${esc(F.away)}</button></span></span>
    </div>`;
  h += colourKey('our opening', 'their threat');
  h += `<div class="deckbar noprint"><button data-step="-1" aria-label="previous slide">&larr;</button>${TITLES.map((t, i) => `<button data-go="${i}" class="${i === slide ? 'on' : ''}">${i + 1}. ${esc(t)}</button>`).join('')}<button data-step="1" aria-label="next slide">&rarr;</button><button data-print="1" class=right>Print all five (one per page)</button></div>`;
  h += `<div class=deck>${slides(F, view)}</div><div class="small muted noprint" style="margin-top:6px">Arrow keys page through. Built from the likely XI: a staff XI change made on the pre-match page is not carried into the pack.</div>`;
  document.getElementById('out').innerHTML = h;
  document.getElementById('fx').onchange = e => { cur = Number(e.target.value); view = 'home'; slide = 0; save(); render(); };
  document.querySelectorAll('.seg button').forEach(b => b.onclick = () => { view = b.dataset.view; save(); render(); }); }
function save() { try { localStorage.setItem('prematch_fx', FX[cur].id); localStorage.setItem('prematch_view', view); } catch (e) {} }
document.addEventListener('click', e => { const t = e.target.closest('[data-go],[data-step],[data-print]'); if (!t) return; if (t.dataset.go != null) show(Number(t.dataset.go)); else if (t.dataset.step) show(slide + Number(t.dataset.step)); else window.print(); });
document.addEventListener('keydown', e => { if (/^(INPUT|SELECT|TEXTAREA)$/.test((e.target || {}).tagName || '')) return; if (e.key === 'ArrowRight' || e.key === 'PageDown') show(slide + 1); else if (e.key === 'ArrowLeft' || e.key === 'PageUp') show(slide - 1); });
window.renderFixture = (i, v, s) => { cur = i; view = v || 'home'; slide = s || 0; render(); };
window.showSlide = show;
render();
</script>
