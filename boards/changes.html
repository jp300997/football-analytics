<script>
// ---------------------------------------------------------------- shared JS kit (every board gets this before its own script)

const f = (v, d = 2) => v == null || Number.isNaN(Number(v)) ? '-' : Number(v).toFixed(d);       // number with d decimals

const lvl = p => p >= 80 ? 'very high' : p >= 60 ? 'high' : p > 40 ? 'average' : p > 20 ? 'low' : 'very low';
const toneCol = t => t === 'good' || t === 'exploit' ? 'var(--opp)' : t === 'bad' || t === 'caution' ? 'var(--thr)' : 'var(--muted)';
const pctBadge = (p, title) => p == null ? '' : `<span class="pct ${p >= 70 ? 'hi' : p <= 30 ? 'lo' : 'mid'}" title="${esc(title || 'percentile in the comparison group')}">${ord(p)}</span>`;
const nTag = n => n == null ? '' : `<span class=n>n=${n}</span>`;
const confWords = n => n == null ? '' : n >= 25 ? 'Strong evidence' : n >= 10 ? 'Reasonable evidence' : 'Thin evidence';
const surname = s => { const t = String(s || '').split(' '); return t.length > 1 ? t.slice(1).join(' ') : s; };
// one-line row that expands: tone 'good' | 'bad' | 'neutral'; head = short verdict, line = the one-line message, body = html shown on click
const row = (tone, head, line, body, note) => `<details class=x style="border-left-color:${toneCol(tone)}"><summary><span class=xv style="color:${toneCol(tone)}">${esc(head)}</span><span class=xd>${esc(line)}</span>${note ? `<span class=fyi>${esc(note)}</span>` : ''}</summary><div class=xb>${body || ''}</div></details>`;
// tab bar + panels: tabs([['key','Label',html], ...], storageKey)
function tabs(defs, key) { window.__TABKEY = key || 'tab';
  return `<div class=tabbar>${defs.map(([k, l]) => `<button data-tab="${k}" onclick="showTab('${k}')">${esc(l)}</button>`).join('')}</div>` + defs.map(([k, _l, h]) => `<div class=tabp data-tab="${k}">${h}</div>`).join(''); }
function showTab(name, anchor) { const ps = [...document.querySelectorAll('.tabp')]; if (!ps.some(x => x.dataset.tab === name)) name = ps[0] && ps[0].dataset.tab;
  ps.forEach(x => x.classList.toggle('on', x.dataset.tab === name)); document.querySelectorAll('.tabbar button').forEach(x => x.classList.toggle('on', x.dataset.tab === name));
  try { localStorage.setItem(window.__TABKEY || 'tab', name); } catch (e) {}
  if (anchor) { const el = document.getElementById(anchor); if (el) { el.scrollIntoView({block: 'start'}); window.scrollBy(0, -110); } } }
function restoreTab(dflt) { let t = dflt; try { t = localStorage.getItem(window.__TABKEY || 'tab') || dflt; } catch (e) {} showTab(t); }
// popup: pop(html) opens the modal; any element with data-pop="id" opens window.POPS[id]
window.POPS = window.POPS || {};
function pop(h) { const m = document.getElementById('modal'); m.firstElementChild.innerHTML = h + '<div style="text-align:right;margin-top:10px"><button onclick="document.getElementById(\'modal\').classList.remove(\'on\')">Close</button></div>'; m.classList.add('on'); }
document.addEventListener('click', e => { const t = e.target.closest('[data-pop]'), m = document.getElementById('modal'); if (t && window.POPS[t.dataset.pop]) pop(window.POPS[t.dataset.pop]); else if (e.target === m) m.classList.remove('on'); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.getElementById('modal').classList.remove('on'); });
// percentile strip: marks = [{p: 0..100, kind: 'now' | 'ref' | 'tick' | 'you', title}]  -> small svg, 0 worst .. 100 best
function strip(marks, W) { W = W || 300; const x = p => 6 + p / 100 * (W - 12);
  let s = `<svg viewBox="0 0 ${W} 22" width="100%" style="display:block;max-width:${W}px"><rect x="${x(25)}" y="7" width="${x(75) - x(25)}" height="8" fill="var(--chip)" /><line x1="6" y1="11" x2="${W - 6}" y2="11" stroke="var(--line)" /><line x1="${x(50)}" y1="4" x2="${x(50)}" y2="18" stroke="var(--line)" />`;
  for (const m of marks) { if (m.p == null) continue; const t = m.title ? `<title>${esc(m.title)}</title>` : '';
    if (m.kind === 'ref') s += `<circle cx="${x(m.p)}" cy="11" r="4.5" fill="var(--card)" stroke="var(--muted)" stroke-width="2">${t}</circle>`;
    else if (m.kind === 'tick') s += `<rect x="${x(m.p) - 1.5}" y="2" width="3" height="18" fill="var(--amber)">${t}</rect>`;
    else if (m.kind === 'you') s += `<path d="M${x(m.p)} 3l5 8l-5 8l-5 -8z" fill="none" stroke="var(--opp)" stroke-width="2">${t}</path>`;
    else s += `<circle cx="${x(m.p)}" cy="11" r="6" fill="var(--ink)">${t}</circle>`; }
  return s + '</svg>'; }
// horizontal bars: items = [{label, value, max, tone, text}]
const bars = items => items.map(i => `<div style="display:flex;gap:8px;align-items:center;margin:2px 0"><span style="width:150px" class=small>${esc(i.label)}</span><div class=bar style="flex:1"><span style="width:${Math.max(0, Math.min(100, 100 * i.value / (i.max || 1)))}%;background:${toneCol(i.tone)}"></span></div><span style="width:90px" class=small>${esc(i.text ?? f(i.value, 1))}</span></div>`).join('');
// sparkline of numbers (zero line drawn when the series crosses zero)
function spark(vals, W, H) { W = W || 260; H = H || 50; if (!vals || vals.length < 2) return ''; const mn = Math.min(...vals, 0), mx = Math.max(...vals, 0), y = v => H - 5 - (v - mn) / ((mx - mn) || 1) * (H - 10), x = i => 5 + i / (vals.length - 1) * (W - 10);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;display:block"><line x1="5" y1="${y(0)}" x2="${W - 5}" y2="${y(0)}" stroke="var(--line)" /><polyline fill="none" stroke="var(--ink)" stroke-width="1.5" points="${vals.map((v, i) => x(i).toFixed(1) + ',' + y(v).toFixed(1)).join(' ')}" /></svg>`; }
// pitch outline for an svg of width W, height H with margins L, T (attack direction is up the page by convention; say so in the caption)
const pitchFrame = (L, T, PW, PH, topLabel, bottomLabel) => `<rect x="${L}" y="${T}" width="${PW}" height="${PH}" rx="6" fill="var(--pitch)" stroke="var(--pitchline)" /><line x1="${L}" y1="${T + PH / 2}" x2="${L + PW}" y2="${T + PH / 2}" stroke="var(--pitchline)" /><circle cx="${L + PW / 2}" cy="${T + PH / 2}" r="${PW * 0.11}" fill="none" stroke="var(--pitchline)" /><rect x="${L + PW * 0.21}" y="${T}" width="${PW * 0.58}" height="${PH * 0.155}" fill="none" stroke="var(--pitchline)" /><rect x="${L + PW * 0.21}" y="${T + PH * 0.845}" width="${PW * 0.58}" height="${PH * 0.155}" fill="none" stroke="var(--pitchline)" /><text x="${L + PW / 2}" y="${T - 5}" font-size="10.5" text-anchor="middle" fill="var(--muted)">${esc(topLabel || '')}</text><text x="${L + PW / 2}" y="${T + PH + 13}" font-size="10.5" text-anchor="middle" fill="var(--muted)">${esc(bottomLabel || '')}</text>`;
const legend = items => `<div class="legend small">${items.map(([sw, txt]) => `<span>${sw}${esc(txt)}</span>`).join('')}</div>`;
const colourKey = (good, bad) => `<div class=colourkey><span><i style="background:var(--opp)"></i>blue = ${esc(good)}</span><span><i style="background:var(--thr)"></i>orange = ${esc(bad)}</span><span><i style="background:var(--muted)"></i>grey = context</span></div>`;
</script>

const TIER = {real: 'Real change', probable: 'Probable, watch', noise: 'Noise so far'};

window.POPS.terms = `<h3>The numbers in football words</h3><p><b>PPDA</b>: passes the opponent is allowed before this team makes a tackle, interception or foul. <b>Lower = more pressing.</b> Around 8 is an aggressive press, around 15 is a team that sits off.</p><p><b>OPPDA</b>: the same count for this team's own passes against the opponent's press. <b>Higher = they play through pressure better.</b></p><p><b>Passes near goal, net</b>: passes completed within about 20 metres of goal, theirs minus the opponent's, per match. Higher = the game is played at the other end.</p><p><b>xG</b>: chance quality, the goals an average finisher would score from those shots.</p>`;
window.POPS.tiers = `<h3>Real, probable, noise</h3><p><b>Real change</b>: the gap is large against the club's own match-to-match swings AND survives a false-alarm check across all ${DATA.n_tests} club-by-axis tests (we accept that about 15% of flagged changes are false).</p><p><b>Probable, watch</b>: a clear gap (a test score, z, of 1.5 or more), but it could be one of the lucky ones you expect when ${DATA.n_tests} tests run at once.</p><p><b>Noise so far</b>: luck alone produces gaps this size. It does not mean nothing changed.</p>`;

// ---------------------------------------------------------------- style map

      ${stillTxt ? `<h4>Not changed yet (or not detectable)</h4><ul class=list>${stillTxt}</ul>` : ''}${shape}${next}<p><b>${esc(c.so || '')}</b> ${dossier(n)} <button class=linkish data-club="${esc(n)}">All eight axes for ${esc(n)}</button></p>`;
    return {quiet: !real.length && !prob.length, h: row(tn, n, line, body, `${c.n_now} matches. Next: ${String(c.confirm || '').split('. ')[0]}.`)}; });
  const all_ = rows.filter(r => !r.quiet), loud = all_.slice(0, 5).map(r => r.h).join(''), quiet = all_.slice(5).concat(rows.filter(r => r.quiet));
  const miss = DATA.missing_new_coach || [];
  return `<div class=verdict><div class=v>${esc(coachVerdict(nc)[0])}</div><div>${esc(coachVerdict(nc)[1])}</div></div><p class=small style="max-width:85ch">Ranked by how much has really changed. Results are ignored.</p>${loud}${quiet.length ? `<details class=fold><summary>${quiet.length} more new coaches</summary>${quiet.map(r => r.h).join('')}</details>` : ''}${miss.length ? `<p class="small muted">New coach but outside the big-five data, so not measured: ${esc(miss.join(', '))}.</p>` : ''}` + takePlain(DATA.coach_take, 'neutral'); }

// ---------------------------------------------------------------- tab 3: by club
function clubSo(c) { if (c.no_baseline) return 'So: no last-season template. Use this season only.';
  const lab = t => HEAD.filter(a => c.axes[a.key] && c.axes[a.key].tier === t).map(a => a.label.toLowerCase()), r = lab('real'), p = lab('probable');
  return r.length ? `So: use this season's numbers on ${r.join(', ')}. Last season's still stand elsewhere.` : p.length ? `So: keep last season's profile. Check ${p.slice(0, 3).join(', ')} on video first.` : `So: last season's profile is still the best guide.`; }
function clubView(n) { const c = CL[n]; if (!c) return '';
  const head = `<div class=verdict style="border-left-color:${c.n_real ? 'var(--ink)' : 'var(--line)'}"><div class=v>${esc(n)}: ${c.no_baseline ? 'no baseline' : c.n_real ? c.n_real + ' real change' + (c.n_real > 1 ? 's' : '') : c.n_probable ? 'nothing confirmed, ' + c.n_probable + ' to watch' : 'no detectable change'}</div><div>${esc(c.headline)}</div><div class="small muted">${esc(LG[c.league] || c.league)}. ${c.new_coach ? `New coach: ${esc(c.manager)}${c.prev_club ? ', from ' + esc(c.prev_club) : ''}${c.old_manager ? ' (last season: ' + esc(c.old_manager) + ')' : ''}.` : `Same coach: ${esc(c.manager)}.`}</div><div class=small>${dossier(n)}</div></div>`;
  if (c.no_baseline) return head + resultsCard(c);
  const rowsFor = list => list.map(a => { const r = c.axes[a.key]; if (!r) return '';
    const marks = [{p: r.pc_prev, kind: 'ref', title: `Last season: ${a.unit} ${r.prev_s} (${ord(r.pc_prev)} percentile of their league)`}, {p: r.pc_now, kind: 'now', title: `This season, our estimate: ${a.unit} ${r.now_s}`}];
    if (c.new_coach && r.pc_coach != null) marks.splice(1, 0, {p: r.pc_coach, kind: 'tick', title: `${c.prev_club} under ${c.manager} last season: ${r.coach_s}`});
    return `<details class=x style="border-left-color:${col(r)}"><summary><span class=xv style="color:${col(r)};min-width:170px">${esc(a.label)}</span><span style="width:230px;flex:none">${strip(marks, 230)}</span><span class=xd>${esc(cap(r.direction))}: ${esc(r.prev_s)} to ${esc(r.now_s)} ${esc(a.short)}</span><span class=fyi><b>${esc(TIER[r.tier])}</b> (${r.n_now} matches)${r.tier === 'real' ? (r.fading ? ', narrowed in the last two' : r.fragile ? ', leans on one match' : '') : r.capped ? ', the ceiling on this axis: the two data sources count long balls differently' : r.matches_needed == null ? ', too small to confirm this season' : `, ${r.matches_needed} more match${r.matches_needed === 1 ? '' : 'es'} needed to confirm`}.</span></summary><div class=xb>${axisBody(c, a, r, n)}</div></details>`; }).join('');
  const zof = a => Math.abs((c.axes[a.key] || {}).z || 0);
  const top3 = HEAD.filter(a => c.axes[a.key] && c.axes[a.key].tier !== 'noise').sort((a, b) => zof(b) - zof(a)).slice(0, 1).map(a => a.key);
  const moved = a => top3.includes(a.key);
  const us = HEAD.filter(a => !a.epl_only), ss = HEAD.filter(a => a.epl_only && c.axes[a.key]);
  const quiet = HEAD.filter(a => c.axes[a.key] && !moved(a));
  const net = HEAD.filter(a => c.axes[a.key] && c.axes[a.key].tier === 'real').reduce((s, a) => s + (c.axes[a.key].better === true ? 1 : c.axes[a.key].better === false ? -1 : 0), 0);
  const tn = net > 0 ? 'good' : net < 0 ? 'bad' : 'neutral';
  return head + `<div class="small muted">Strips: left = least in their league. ${legendInline(c)}</div>${rowsFor(us.filter(moved))}${ss.filter(moved).length ? `<h4 style="margin-top:12px">From the Premier League stat sheets (${c.axes[ss[0].key].n_now} matches)</h4>${rowsFor(ss.filter(moved))}` : ''}${quiet.length ? `<details class=fold><summary>The other ${quiet.length} axes: ${quiet.map(a => a.label.toLowerCase()).join(', ')}</summary>${rowsFor(quiet)}</details>` : ''}<details class=fold><summary>Shape and results context</summary><div class=grid>${shapeCard(c)}${resultsCard(c)}</div></details>` + takeBlock(c.take, tn); }
const legendInline = c => `<svg width="12" height="12" style="vertical-align:-2px"><circle cx="6" cy="6" r="4" fill="var(--card)" stroke="var(--muted)" stroke-width="2"/></svg> last season <svg width="14" height="12" style="vertical-align:-2px"><circle cx="7" cy="6" r="5.5" fill="var(--ink)" stroke="none"/></svg> this season (our estimate)${c.new_coach && c.prev_club_in_data ? ' <svg width="8" height="14" style="vertical-align:-3px"><rect x="2" y="0" width="3" height="14" fill="var(--amber)" stroke="none"/></svg> coach\'s old team' : ''}. Colour only when the change is real.`;
function shapeCard(c) { const s = c.shape || {}; if (!s.prev && !s.now) return '';
  return `<div class=card><h3>Shape</h3>${s.prev && s.now ? (s.changed ? `<p style="margin:4px 0"><b>Changed:</b> ${esc(s.prev)} last season (${f(s.prev_share, 0)}% of minutes), ${esc(s.now)} this season (${f(s.now_share, 0)}%).</p>` : `<p style="margin:4px 0"><b>Same shape:</b> ${esc(s.now)} (${f(s.prev_share, 0)}% of minutes last season, ${f(s.now_share, 0)}% now).</p>`) : `<p style="margin:4px 0">${esc(s.now || s.prev)} (only one season available).</p>`}<div class="small muted">Most used formation, by minutes.</div></div>`; }
function resultsCard(c) { const r = c.results || {}; if (!r.n_now) return '';
  return `<div class=card><h3>Results context</h3><p style="margin:4px 0">${f(r.ppg_now, 2)} points a match${r.ppg_prev != null ? ` (${f(r.ppg_prev, 2)} last season)` : ''}. xG difference ${sgn(r.xgd_now, 2)} a match${r.xgd_prev != null ? ` (${sgn(r.xgd_prev, 2)} last season)` : ''}. Goal difference ${sgn(r.gd_now, 2)} a match${r.gd_prev != null ? ` (${sgn(r.gd_prev, 2)})` : ''}.</p><div class="small muted">Context only: points swing on finishing luck.</div></div>`; }
function byClub() { const groups = {}; names.forEach(n => (groups[CL[n].league] = groups[CL[n].league] || []).push(n));
  return `<div class=rowx style="margin:8px 0"><select id=clubsel>${Object.keys(LG).filter(l => groups[l]).map(l => `<optgroup label="${esc(LG[l])}">${groups[l].map(n => `<option value="${esc(n)}">${esc(n)}${CL[n].new_coach ? ' (new coach)' : ''}${CL[n].n_real ? ' •' : ''}</option>`).join('')}</optgroup>`).join('')}</select><span class="small muted">• = a real change. Click a row for the reason. <button class=linkish data-pop=terms>PPDA, OPPDA?</button></span></div><div id=clubout></div>`; }
function pickClub(n) { if (!CL[n]) return; const s = document.getElementById('clubsel'); s.value = n; document.getElementById('clubout').innerHTML = clubView(n); try { localStorage.setItem('changes_club', n); } catch (e) {} }

// ---------------------------------------------------------------- tab 4: method
function method() { const all = []; names.forEach(n => Object.keys(CL[n].axes).forEach(k => all.push({club: n, axis: k, z: CL[n].axes[k].z, tier: CL[n].axes[k].tier}))); all.sort((a, b) => Math.abs(b.z) - Math.abs(a.z));
  return `<div class=card style="max-width:95ch"><ol style="margin:0;padding-left:18px"><li><b>Strip out the fixture list.</b> Last season tells us how much each opponent and playing at home moves every number. That is removed from every match, so an early run against top sides does not look like a style change.</li><li><b>Compare with the club's own swings.</b> The gap between seasons is measured against how much that club's numbers normally jump from match to match.</li><li><b>Pull small samples back.</b> The change shown is shrunk by n / (n + k): k = 3 for pressing, 3.5 for territory and style shares, 4 for chances.</li><li><b>Guard against false alarms.</b> ${DATA.n_tests} club-by-axis tests are run, so some would look big by luck. Only changes that pass a false-discovery check (Benjamini-Hochberg, 15%) are called real.</li></ol><p class=small style="margin-bottom:0">With 5 matches a change must be about 1.4 times the club's normal match-to-match swing to be confirmed. No flag does not mean no change.</p></div>
  <details class=fold><summary>The eight axes and where they come from</summary><ul class=list>${HEAD.map(a => `<li><b>${esc(a.label)}</b>${a.epl_only ? ' (Premier League only)' : ''}: ${esc(a.plain)}</li>`).join('')}</ul><p class=small>The first four come from Understat for both seasons. The last four compare last season's event data with this season's official stat sheets: only metrics both providers define the same way are used, and the league's own average shift between the two is removed first.</p></details>
  <details class=fold><summary>Known limits</summary><ul class=list><li>Opponent effects come from last season. An opponent that has itself changed is adjusted with its old profile; promoted opponents get the average of the clubs they replaced.</li><li>The running-signal alarm lines are a second opinion, not the verdict. The verdict is the false-alarm-controlled test.</li><li>Placebo check: the same test on every 5-match block inside last season, where nothing changed by construction, gives z-scores spread ${Object.entries(DATA.inflation || {}).filter(([k]) => AXK[k] && AXK[k].headline).map(([k, v]) => AXK[k].label.toLowerCase() + ' ' + f(v, 2)).join(', ')} times as wide as pure luck (1.00 = perfect). Every z is divided by its axis's figure.</li><li>Finishing, goals and points are left out on purpose: they need 8 to 12 matches or more to mean anything.</li>${(DATA.notes || []).map(x => `<li>${esc(x)}</li>`).join('')}</ul></details>
  <details class=fold><summary>League drift removed (in model units)</summary><div class=wrap><table><tr><th>League</th><th>Axis</th><th>Drift</th></tr>${(DATA.drift || []).map(d => `<tr><td>${esc(LG[d.league] || d.league)}</td><td>${esc(AXK[d.axis].label)}</td><td>${sgn(d.drift, 3)}</td></tr>`).join('')}</table></div></details>
  <details class=fold><summary>Every test (${all.length} rows, largest first)</summary><div class=wrap>${allTable(all)}</div></details>`
  + takePlain({title: 'What this page can and cannot be used for',
      what: `It tells you which clubs have moved far enough that last season's numbers are out of date, and which have not. It is not a form guide.`,
      why: `Every test is against the club's own match-to-match swing after opponents and venue come out, with false alarms held to one in seven across all ${DATA.n_tests} tests. At this point in the season that means only big shifts are visible.`,
      so: `Use it as the first page before a dossier: check whether the profile you are about to read is still current, then go to the dossier for the detail.`,
      branches: [`If an axis says "noise", read last season's dossier as written.`,
                 `If it says "real", the club page's takeaway tells you what the new style costs them.`],
      conf: `Finishing, goals and points are left out on purpose: they need ten matches or more to mean anything.`, badge: ''}, 'neutral'); }

// ---------------------------------------------------------------- mount
document.getElementById('out').innerHTML = tabs([['head', 'Headlines', headlines()], ['coach', 'New coaches', coaches()], ['club', 'By club', byClub()], ['method', 'Method', method()]], 'changes_tab');
restoreTab('head'); drawMap();
document.addEventListener('click', e => { const sc = e.target.closest('[data-scope]'); if (sc) { MAPSCOPE = sc.dataset.scope; drawMap(); return; }
  const t = e.target.closest('[data-club]'); if (t && CL[t.dataset.club]) { showTab('club'); pickClub(t.dataset.club); window.scrollTo(0, 0); } });
document.getElementById('clubsel').addEventListener('change', e => pickClub(e.target.value));
{ let first = null; try { first = localStorage.getItem('changes_club'); } catch (e) {} const top = DATA.movers.length ? DATA.movers[0].club : names[0]; pickClub(CL[first] ? first : top); }
</script>
